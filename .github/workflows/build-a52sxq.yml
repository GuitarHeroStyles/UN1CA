name: Build a52sxq flashable zip

# Manual build of the TWRP/OrangeFox-flashable ROM zip for the Galaxy A52s 5G.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build a52sxq
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        env:
          PLATFORM_KEY_PK8: ${{ secrets.PLATFORM_KEY_PK8 }}
          PLATFORM_KEY_PEM: ${{ secrets.PLATFORM_KEY_PEM }}
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Optional: without these secrets the build is a non-official (test key) build
          if [ -n "$PLATFORM_KEY_PK8" ] && [ -n "$PLATFORM_KEY_PEM" ]; then
            echo -n "$PLATFORM_KEY_PK8" | base64 --decode > security/unica_platform.pk8
            echo -n "$PLATFORM_KEY_PEM" | base64 --decode > security/unica_platform.x509.pem
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate build config
        run: |
          source ./buildenv.sh a52sxq
          {
            echo "DEBUG=$DEBUG"
            echo "SRC_DIR=$SRC_DIR"
            echo "OUT_DIR=$OUT_DIR"
            echo "ODIN_DIR=$ODIN_DIR"
            echo "FW_DIR=$FW_DIR"
            echo "TOOLS_DIR=$TOOLS_DIR"
            echo "APKTOOL_DIR=$APKTOOL_DIR"
            echo "WORK_DIR=$WORK_DIR"
            echo "TMP_DIR=$TMP_DIR"
          } >> "$GITHUB_ENV"
          sed -e "/Automatically/d" -e "s/\"//g" "$OUT_DIR/config.sh" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: ./scripts/build_dependencies.sh

      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: ./scripts/extract_fw.sh

      - name: Build ROM and flashable zip
        run: ./scripts/make_rom.sh --build-rom-zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: UN1CA-a52sxq-flashable
          path: out/UN1CA_*.zip
          if-no-files-found: error
          compression-level: 0
